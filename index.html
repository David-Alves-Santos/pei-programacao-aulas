<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Programação de Aulas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra de ferramentas + faixa de alertas + a "folha" (igual ao Excel do coordenador) + painel lateral de ação; cadastros em janelas */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#1a2333; --muted:#5a6578; --line:#d3d9e2;
  --accent:#1d5aa6; --accent-ink:#ffffff; --accent-soft:#dfe9f6;
  --crit:#c4231b; --crit-soft:#fbe3e1; --warn:#a65f00; --warn-soft:#fdf0d9; --ok:#2d7a3e;
  /* a folha é papel: as cores dela são as mesmas nos dois temas, de propósito */
  --sheet:#ffffff; --sheet-ink:#111111; --sheet-line:#3a3a3a;
  --c-vaga:#ffef3a; --c-falta:#c8daf1; --c-sub:#d0021b; --c-eletiva:#f5a347; --c-almoco:#92d050;
  --c-cafe:#c6bf9b; --c-clube:#ffff3d; --c-aula:#12b553; --c-horaM:#fbe3d4; --c-fora:#d9d9d9;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1b212b; --ink:#e6eaf1; --muted:#9aa5b8; --line:#2e3746;
  --accent:#6aa4ec; --accent-ink:#0d1420; --accent-soft:#1f3150;
  --crit:#ff7a70; --crit-soft:#3a1d1c; --warn:#f0b35a; --warn-soft:#352812; --ok:#7cc98c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1b212b; --ink:#e6eaf1; --muted:#9aa5b8; --line:#2e3746;
  --accent:#6aa4ec; --accent-ink:#0d1420; --accent-soft:#1f3150;
  --crit:#ff7a70; --crit-soft:#3a1d1c; --warn:#f0b35a; --warn-soft:#352812; --ok:#7cc98c; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topo{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:10px}
.marca{font-weight:800;font-stretch:80%;letter-spacing:.02em;text-transform:uppercase;font-size:15px;margin-right:auto}
.marca small{display:block;font-weight:500;font-stretch:100%;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}
.grupo{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 11px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.perigo{color:var(--crit)}
.btn.mini{padding:4px 8px;font-size:12px}
.btn.link{border:0;background:transparent;color:var(--accent);padding:2px 4px;text-decoration:underline}
.data{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-family:var(--f-mono);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:grid;gap:2px;min-width:220px;z-index:12}
.menu-pop button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:5px;font-size:13px;font-weight:600}
.menu-pop button:hover{background:var(--accent-soft)}
.menu-pop small{display:block;font-weight:400;color:var(--muted);font-size:11px}

.aviso-ex{background:var(--accent-soft);border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.aviso-ex b{font-weight:700}
.aviso-ex span{flex:1 1 320px;min-width:0}

.alertas{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.resumo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--surface);color:var(--ok);border:1px solid var(--line)}
.chip.neutro{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.lista-alertas{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.lista-alertas li button{width:100%;text-align:left;border:0;border-left:4px solid var(--crit);background:var(--surface);padding:6px 10px;border-radius:4px;font-size:13px}
.lista-alertas li.warn button{border-left-color:var(--warn)}
.lista-alertas li button b{font-weight:700;margin-right:4px}

.palco{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.palco.sem-painel{grid-template-columns:minmax(0,1fr)}
.rolagem{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.vazio-msg{padding:30px 20px;font-size:15px;display:grid;gap:12px;justify-items:start}

/* ===== a folha ===== */
#folha{background:var(--sheet);color:var(--sheet-ink);width:max-content;padding:6px}
.folha-tit{text-align:center;font-weight:800;font-size:20px;letter-spacing:.03em;padding:8px 0 10px;border:1px solid var(--sheet-line);border-bottom:0}
.folha-tit span{font-family:var(--f-mono);font-weight:600;font-size:14px;margin-left:10px}
table.grade{border-collapse:collapse;table-layout:fixed;font-stretch:78%}
.grade th,.grade td{border:1px solid var(--sheet-line);text-align:center;vertical-align:middle;padding:3px 3px}
.grade thead th{font-size:16px;font-weight:800;height:30px}
.grade thead th.peq{font-size:9px;font-weight:700}
.grade thead th.t-click{cursor:pointer}
.grade thead th.t-click:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.grade col.c-aula{width:30px}.grade col.c-hora{width:62px}.grade col.c-turma{width:96px}
.grade td.n-aula{font-weight:800;font-size:13px}
.grade td.n-aula.m{background:var(--c-aula);color:#fff}
.grade td.hora{font-family:var(--f-mono);font-size:10px;font-weight:600;line-height:1.25;font-stretch:100%}
.grade td.hora.m{background:var(--c-horaM)}
.grade td.hora.edit{cursor:pointer;text-decoration:underline dotted}
.grade td.hora.edit:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.grade tbody tr{height:54px}
td.cel{font-size:10px;font-weight:700;text-transform:uppercase;line-height:1.2;cursor:pointer;position:relative;word-break:break-word}
td.cel:hover{box-shadow:inset 0 0 0 2px var(--accent)}
td.cel .disc{display:block}
td.cel .prof{display:block;font-weight:600}
td.cel .sub{color:var(--c-sub);font-weight:800}
td.cel .obs{display:block;font-size:8px;font-weight:700;letter-spacing:.03em}
td.cel.vaga{background:var(--c-vaga)}
td.cel.falta{background:var(--c-falta)}
td.cel.eletiva{background:var(--c-eletiva)}
td.cel.fora{background:var(--c-fora);color:#444}
td.cel.dispensa{background:repeating-linear-gradient(45deg,#fff,#fff 6px,#eee 6px,#eee 12px)}
td.cel.livre{color:#aaa;font-weight:500}
td.cel.evento{background:#cfe0f5}
.folha-aviso{border:1px solid var(--sheet-line);border-bottom:0;background:#ffe3e0;color:#b00000;font-weight:800;font-size:12px;text-align:center;padding:5px 8px;letter-spacing:.03em}
td.cel.vazia .prof{color:var(--c-sub)}
td.cel.sel{box-shadow:inset 0 0 0 3px var(--accent)}
td.cel.bad{box-shadow:inset 0 0 0 3px #e0140b}
td.cel.bad::after{content:"!";position:absolute;top:1px;right:3px;font-size:11px;color:#e0140b;font-weight:900}
td.cel.warn{box-shadow:inset 0 0 0 3px #e08a00}
td.cel.warn::after{content:"!";position:absolute;top:1px;right:3px;font-size:11px;color:#e08a00;font-weight:900}
td.bloco{font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
td.bloco.cafe{background:var(--c-cafe)}
td.bloco.outro{background:var(--c-clube)}
td.bloco.almoco{background:var(--c-almoco);font-size:9px;font-weight:700;cursor:pointer;letter-spacing:0}
td.bloco.almoco:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.sem-aula{padding:40px 30px;text-align:center;font-weight:800;font-size:18px;border:1px solid var(--sheet-line)}
#folha.exportando td.cel::after{display:none}
#folha.exportando td.cel,#folha.exportando td.hora,#folha.exportando th{box-shadow:none!important;text-decoration:none}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted);margin-top:8px}
.legenda i{display:inline-block;width:12px;height:12px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}

/* ===== painel ===== */
.painel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto}
.painel h2{margin:0 0 2px;font-size:17px;font-weight:800;text-wrap:balance}
.sub-h{color:var(--muted);font-size:12px;font-family:var(--f-mono);margin-bottom:10px}
.painel h3,.modal h3{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.painel p{margin:4px 0}
.fechar{float:right;border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted)}
.cands{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.cand.top{border-color:var(--accent);background:var(--accent-soft)}
.cand.ruim{opacity:.75}
.cand .nome{font-weight:700;min-width:0}
.cand .why{grid-column:1/-1;font-size:12px;color:var(--muted)}
.cand .why .quebra{color:var(--crit);font-weight:600}
.campo{display:grid;gap:4px;margin-bottom:10px;min-width:0}
.campo label,.rot{font-size:12px;font-weight:600;color:var(--muted)}
.campo input[type=text],.campo input[type=date],.campo input[type=number],.campo select,.campo textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.check{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;font-size:13px}
.check input{margin-top:3px}
.linha-btn{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.nota{font-size:12px;color:var(--muted)}
.alerta-cel{background:var(--crit-soft);color:var(--crit);border-radius:6px;padding:6px 9px;font-size:13px;margin-bottom:6px}
.alerta-cel.warn{background:var(--warn-soft);color:var(--warn)}
.ok-msg{background:var(--accent-soft);border-radius:6px;padding:7px 9px;font-size:13px;margin-top:8px}
.erro-msg{background:var(--crit-soft);color:var(--crit);border-radius:6px;padding:7px 9px;font-size:13px;margin-top:8px}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:8px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 12px;min-width:0}
legend{font-weight:700;font-size:13px;padding:0 4px}
fieldset.vig input[type=date]{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:2px 6px;font-family:var(--f-mono);font-size:12px}

/* ===== janelas (modais) ===== */
.modal-fundo{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:20}
.modal{background:var(--surface);border-radius:10px;max-width:720px;width:100%;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3);min-width:0}
.modal.largo{max-width:1040px}
.modal h2{margin:0 0 4px;font-size:19px}
.modal img{max-width:100%;border:1px solid var(--line);display:block;margin:8px 0}
.modal textarea.json{min-height:160px;font-family:var(--f-mono);font-size:12px}
.grade-aj{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 18px}
.etq-linha{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.etq-linha input[type=text]{flex:1;min-width:0}
.tab-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.tab{border-collapse:collapse;width:100%;font-size:13px}
.tab th,.tab td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
.tab th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg);position:sticky;top:0}
.tab td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tab tr.turma-h td{background:var(--accent-soft);font-weight:800}
.tab tr.sub-l td{background:var(--bg);font-size:12px}
.tab tr.mudou td{box-shadow:inset 3px 0 0 var(--accent)}
.tab select{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 6px;max-width:100%}
.tab small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;min-width:0}
.card.fora-quadro{opacity:.65}
.dias-chk{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px}
.dias-chk label{display:flex;gap:4px;align-items:center}
.texto-dia{font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;background:var(--bg);border-radius:6px;padding:8px;margin:6px 0}
.passos{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.passos span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}

@media (max-width:900px){
  .palco{grid-template-columns:minmax(0,1fr)}
  .painel{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:65vh;border-radius:12px 12px 0 0;z-index:15;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25)}
  .menu-pop{right:auto;left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.nuvem{font-size:12px;color:var(--muted);white-space:nowrap}
.nuvem.erro{color:var(--crit);font-weight:600}
.login{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:380px;display:grid;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.login h1{margin:0;font-size:20px}
.login p{margin:0}
.login label{display:grid;gap:4px;font-size:13px;font-weight:600}
.login input{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0}
.login .msg{color:var(--crit);font-size:13px;min-height:1.2em}
.login .btn{padding:10px 12px;font-size:14px}
</style>
</head>
<body>

<header class="topo">
  <div class="marca">Programação de Aulas<small id="nome-dia">—</small></div>
  <div class="grupo">
    <button class="btn" id="b-ant" aria-label="Dia anterior">◀</button>
    <input type="date" class="data" id="i-data" aria-label="Data">
    <button class="btn" id="b-prox" aria-label="Próximo dia">▶</button>
  </div>
  <div class="seg" role="group" aria-label="Modo">
    <button id="m-dia" aria-pressed="true">Programação do dia</button>
    <button id="m-base" aria-pressed="false">Grade da escola</button>
  </div>
  <div class="grupo">
    <button class="btn pri" id="b-falta">Registrar falta</button>
    <button class="btn" id="b-img">Gerar imagem</button>
    <button class="btn" id="b-hor">Ajustar horário</button>
    <button class="btn" id="b-meu">Meu dia</button>
    <span class="nuvem" id="nuvem" aria-live="polite"></span>
    <details class="menu" id="menu"><summary class="btn">Cadastros ▾</summary>
      <div class="menu-pop">
        <button data-abre="atrib">Atribuições<small>Quem dá cada aula, licenças, mudanças com data</small></button>
        <button data-abre="profs">Professores<small>Dias em que vêm, ATPC, carga</small></button>
        <button data-abre="turmas">Turmas e ano letivo<small>Turmas, dias, segmentos, novo ano</small></button>
        <button data-abre="contador">Contador de coberturas<small>Quem cobriu quanto</small></button>
        <button data-abre="ajustes">Ajustes<small>Critério de substituição, almoço, etiquetas</small></button>
        <button data-abre="backup">Backup</button>
        <button data-abre="senha">Trocar minha senha</button>
        <button data-abre="sair">Sair</button>
      </div>
    </details>
  </div>
</header>
<div id="aviso"></div>
<section class="alertas" id="alertas" aria-live="polite"></section>
<main class="palco" id="palco">
  <div class="rolagem"><div id="folha"></div>
    <div class="legenda" id="legenda">
      <span><i style="background:var(--c-vaga)"></i>Aula sem professor atribuído (coberta)</span>
      <span><i style="background:var(--c-falta)"></i>Falta ou licença: titular em preto, substituto em vermelho</span>
      <span><i style="background:var(--c-eletiva)"></i>Eletiva</span>
      <span><i style="background:var(--c-fora)"></i>Turma fora da escola</span>
      <span><i style="background:var(--c-almoco)"></i>Almoço / pedagogia da presença</span>
      <span>Clique numa aula, no nome da turma ou no horário para agir</span>
    </div>
  </div>
  <aside class="painel" id="painel" hidden></aside>
</main>
<div id="modal"></div>
<div id="login" class="login"><form><h1>Programação de Aulas</h1><p class="nota">Carregando…</p></form></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
"use strict";
/* =====================================================================

function anoDe(ds){for(const k in S.anos){const a=S.anos[k];if(a.inicio<=ds&&ds<=a.fim)return a}return null}

function versaoEm(ano,inicio,nome){let v=ano.versoes.find(x=>x.inicio===inicio);if(!v){v={id:uid('v'),inicio,nome:nome||'Mudança',grade:{},atrib:{},horarios:{},almoco:{}};ano.versoes.push(v)}else if(nome&&!v.nome.split(' · ').includes(nome))v.nome+=' · '+nome;return v}
function sinal(ano,ds,mod,seg){const key=ano.id+'|'+ds+'|'+mod+'|'+seg;if(_sc.has(key))return _sc.get(key);
 const base=(ano.sinais[mod]||{})[seg]||[];const vs=versoesAte(ano,ds);
 const r=base.map((s,idx)=>{const k=mod+'|'+seg+'|'+idx;for(let i=vs.length-1;i>=0;i--){const h=vs[i].horarios[k];if(h)return Object.assign({},s,h,{idx})}return Object.assign({},s,{idx})});

/* horário do DIA: o horário de sinal com as trocas e os blocos transformados em aula daquela data */
function temAjusteHorario(dr){return !!(dr&&((dr.trocas&&dr.trocas.length)||(dr.blocoAula&&Object.keys(dr.blocoAula).length)))}
function sinalDia(ano,ds,mod,seg,dr){const base=sinal(ano,ds,mod,seg);if(!temAjusteHorario(dr))return base;
 const key='D|'+ano.id+'|'+ds+'|'+mod+'|'+seg;if(_sc.has(key))return _sc.get(key);
 const r=base.map(s=>Object.assign({},s));
 for(const t of (dr.trocas||[])){if(t.seg!==seg)continue;const X=r[t.x],Y=r[t.y];if(!X||!Y)continue;
  const cx={a:X.a,b:X.b,de:X.de||{i:X.i,f:X.f}},cy={a:Y.a,b:Y.b,de:Y.de||{i:Y.i,f:Y.f}};
  for(const o of [X,Y]){delete o.a;delete o.b;delete o.de}
  Object.assign(X,cy);Object.assign(Y,cx);for(const o of [X,Y]){if(o.a===undefined)delete o.a;if(o.b===undefined)delete o.b;if(o.de&&o.de.i===o.i)delete o.de}}
 for(const k in (dr.blocoAula||{})){const[sg,p]=k.split('|');if(sg!==seg)continue;const s=r[+p];if(!s||!s.b)continue;s.extra={rot:dr.blocoAula[k].rot||'Aula',bloco:s.b};s.a='x'+p;delete s.b}

function slotOf(ano,ds,mod,seg,a,dr){return sinalDia(ano,ds,mod,seg,dr).find(x=>x.a===a)}
const pa=v=>/^\d+$/.test(v)?+v:v;

/* célula efetiva = grade vigente (que disciplina) + atribuição vigente (quem) + licença + o que aconteceu no dia */
function eff(ds,tid,a,dr){
 const c=ctx(ds);const k=c.dia+'|'+tid+'|'+a;
 const extra=typeof a==='string'; /* aula criada no lugar de um bloco (ex.: Clube cancelado) */
 const g=extra?{disc:'',grupo:'',tag:null}:look(c.ano,ds,'grade',k);
 if(!g)return {vazio:true,disc:'',grupo:'',ocupante:null};
 const at=extra?{prof:null}:(look(c.ano,ds,'atrib',k)||{prof:null});
 const e={vazio:false,disc:g.disc||'',grupo:g.grupo||'',tag:g.tag||null,titular:at.prof||null,vaga:!at.prof,cobre:at.prof?null:(at.cobre||null),
  falta:false,sub:null,motivo:null,troca:false,licenca:false,dispensa:false,fora:false,extra};
 const tt=turmaDe(c.ano,tid);const sl=tt&&slotOf(c.ano,ds,c.mod,tt.seg,a,dr);
 if(extra)e.disc=sl&&sl.extra?sl.extra.rot:'Aula';
 if(e.titular){const l=licencaDe(e.titular,ds);if(l){e.falta=true;e.licenca=true;e.sub=l.sub||null;e.motivo=l.motivo||'Licença'}}
 if(dr){
  if(dr.fora&&dr.fora[tid]!==undefined){e.fora=true;e.foraMotivo=dr.fora[tid]}
  const o=dr.cells&&dr.cells[tid+'|'+a];
  if(o){
   if(!e.vaga&&(o.falta||e.falta)){e.falta=true;if('sub' in o){if(e.licenca&&o.sub!==e.sub)e.licenca=false;e.sub=o.sub||null}if(o.motivo)e.motivo=o.motivo;e.troca=!!o.troca}
   if(e.vaga&&'cobre' in o)e.cobre=o.cobre||null;
   if('tag' in o)e.tag=o.tag||null;
   if(o.dispensa)e.dispensa=true;
  }
 }
 if(dr&&dr.eventos&&dr.eventos.length&&sl){for(const ev of dr.eventos){if(ev.turmas!=='todas'&&!ev.turmas.includes(tid))continue;
  if(min(sl.i)<min(ev.f)&&min(ev.i)<min(sl.f)){e.evento=ev.nome;e.eventoLivre=ev.prof==='livre';break}}}
 e.ocupante=(e.fora||e.dispensa||e.eventoLivre)?null:(e.vaga?e.cobre:(e.falta?e.sub:e.titular));
 return e;
}
function cadaAula(ds,fn,dr){const c=ctx(ds);if(!c.ano||!c.mod)return;for(const t of c.ano.turmas)for(const s of aulasDoSeg(c.ano,ds,c.mod,t.seg,dr))fn(t,s)}
function ocupacoes(ds,dr){
 const c=ctx(ds),out=[];if(!c.mod)return out;
 cadaAula(ds,(t,s)=>{const e=eff(ds,t.id,s.a,dr);if(e.ocupante)out.push({prof:e.ocupante,i:min(s.i),f:min(s.f),tid:t.id,a:s.a,grupo:e.grupo})},dr);
 const aus=(dr&&dr.ausentes)||{};
 for(const pid of c.ano.profs){const p=S.profs[pid];if(!p||aus[pid]||licencaDe(pid,ds))continue;
  for(const cp of (p.comp||[]))if(cp.dia===c.dia)out.push({prof:pid,i:min(cp.i),f:min(cp.f),comp:cp.nome||'Compromisso'})}
 /* blocos de reunião (ex.: Clube = ATPCG): todos os professores presentes estão ocupados nesse horário */
 const reun=new Set((S.aj.blocosReuniao||[]).map(norm)),vistos=new Set();
 if(reun.size)for(const sg of c.ano.segs){if(!c.ano.turmas.some(t=>t.seg===sg.id))continue;
  for(const s of sinalDia(c.ano,ds,c.mod,sg.id,dr)){if(!s.b||!reun.has(norm(s.b))||vistos.has(s.i+s.f))continue;vistos.add(s.i+s.f);
   for(const pid of c.ano.profs){const p=S.profs[pid];if(!p||aus[pid]||licencaDe(pid,ds)||(p.dias&&p.dias[c.dia]===false))continue;out.push({prof:pid,i:min(s.i),f:min(s.f),comp:'reunião ('+s.b.toLowerCase()+')'})}}}
 return out}
function indisponiveis(ds,dr){const out=[];cadaAula(ds,(t,s)=>{const e=eff(ds,t.id,s.a,dr);if(e.falta&&e.titular)out.push({prof:e.titular,i:min(s.i),f:min(s.f)})},dr);return out}
function maiorFolga(intervalos){const W0=min(S.aj.almIni),W1=min(S.aj.almFim);
 const xs=intervalos.map(x=>[Math.max(x[0],W0),Math.min(x[1],W1)]).filter(x=>x[0]<x[1]).sort((p,q)=>p[0]-q[0]);
 let cur=W0,best=0;for(const[i,f]of xs){if(i>cur)best=Math.max(best,i-cur);cur=Math.max(cur,f)}best=Math.max(best,W1-cur);return best}
const onde=(ano,o)=>o.comp?`em ${o.comp} (${hm(o.i)}–${hm(o.f)})`:`no ${tn(ano,o.tid)} (${hm(o.i)}–${hm(o.f)})`;

/* =====================================================================
   REGRAS (alertas)
   ===================================================================== */
function analisar(ds,dr){
 const c=ctx(ds),R={conf:[],alm:[],disp:[],desc:[],lista:[],cel:{}};if(!c.mod)return R;
 const occ=ocupacoes(ds,dr);
 const marca=(o,tipo,txt)=>{if(o.comp)return;const k=o.tid+'|'+o.a;(R.cel[k]=R.cel[k]||[]).push({tipo,txt})};
 const kOf=o=>o.comp?null:o.tid+'|'+o.a;
 const porProf={};for(const o of occ)(porProf[o.prof]=porProf[o.prof]||[]).push(o);
 for(const p in porProf){const xs=porProf[p].sort((x,y)=>x.i-y.i);
  for(let i=0;i<xs.length;i++)for(let j=i+1;j<xs.length;j++){const x=xs[i],y=xs[j];
   if(!(x.i<y.f&&y.i<x.f))continue;
   if(x.comp&&y.comp)continue;
   if(!x.comp&&!y.comp&&x.grupo&&x.grupo===y.grupo)continue; /* aula agrupada (eletiva, aula conjunta): é de propósito */
   const txt=`${nm(p)} está ${onde(c.ano,x)} e ${onde(c.ano,y)}`;
   R.conf.push({txt,k:kOf(x)||kOf(y)});marca(x,'crit',txt);marca(y,'crit',txt)}
  const aulas=xs.filter(o=>!o.comp);
  if(aulas.length&&S.profs[p]&&S.profs[p].dias&&S.profs[p].dias[c.dia]===false){const txt=`${nm(p)} não vem à escola neste dia da semana (${NOME_DIA[c.dia].toLowerCase()}), mas está escalado ${onde(c.ano,aulas[0])}`;R.disp.push({txt,k:kOf(aulas[0])});aulas.forEach(o=>marca(o,'warn',txt))}
  const folga=maiorFolga(xs.map(o=>[o.i,o.f]));
  if(folga<S.aj.almMin&&aulas.length){const ult=aulas.filter(o=>o.i<min(S.aj.almFim)&&o.f>min(S.aj.almIni));
   const txt=`${nm(p)} não tem ${S.aj.almMin} min livres entre ${S.aj.almIni} e ${S.aj.almFim} (maior intervalo: ${folga} min)`;
   R.alm.push({txt,k:ult[0]?kOf(ult[0]):null});ult.forEach(o=>marca(o,'crit',txt))}}
 cadaAula(ds,(t,s)=>{const e=eff(ds,t.id,s.a,dr);
  if(!e.vazio&&!e.fora&&!e.dispensa&&!e.eventoLivre&&!e.ocupante){const txt=`${t.nome}, ${e.extra?'aula extra':s.a+'ª aula'} (${s.i}–${s.f}): ${e.vaga?'aula sem professor e sem ninguém cobrindo':(e.licenca?'professor de licença sem substituto':'falta sem substituto')}`;R.desc.push({txt,k:t.id+'|'+s.a});(R.cel[t.id+'|'+s.a]=R.cel[t.id+'|'+s.a]||[]).push({tipo:'warn',txt})}},dr);
 if(S.aj.conferirLista){for(const sg of c.ano.segs){const sl=sinal(c.ano,ds,c.mod,sg.id).find(x=>norm(x.b)==='almoco');if(!sl)continue;const i=min(sl.i),f=min(sl.f);
  for(const p of almocoLista(c.ano,ds,c.dia,sg.id)){const o=occ.find(o=>o.prof===p&&!o.comp&&o.i<f&&i<o.f);
   if(o){const txt=`${nm(p)} está na lista do almoço do ${sg.nome}, mas dá aula no ${tn(c.ano,o.tid)} às ${hm(o.i)}`;R.lista.push({txt,k:kOf(o)});marca(o,'warn',txt)}}}}

}

/* =====================================================================
   CRITÉRIO DE SUBSTITUIÇÃO (contador justo)
   ===================================================================== */
function contagens(de,ate){const key='c|'+de+'|'+ate;if(_cont.has(key))return _cont.get(key);const m={};
 for(const ds in S.days){if(ds<de||ds>ate)continue;const dr=S.days[ds];if(dr.semAula)continue;const c=ctx(ds);if(!c.mod)continue;
  cadaAula(ds,(t,s)=>{const e=eff(ds,t.id,s.a,dr);if(e.fora||e.dispensa||e.eventoLivre)return;
   if(e.falta&&e.sub&&!e.troca&&!e.licenca)m[e.sub]=(m[e.sub]||0)+1;else if((S.aj.contaVaga||e.extra)&&e.vaga&&e.cobre)m[e.cobre]=(m[e.cobre]||0)+1},dr)}
 for(const x of S.ajCont)if(x.data>=de&&x.data<=ate)m[x.prof]=(m[x.prof]||0)+Number(x.n||0);
 _cont.set(key,m);return m}
function cargaSemana(ds){const key='g|'+segunda(ds);if(_cont.has(key))return _cont.get(key);const m={};
 for(const d of semana(ds)){const c=ctx(d);if(!c.mod)continue;cadaAula(d,(t,s)=>{const e=eff(d,t.id,s.a,null);if(e.titular)m[e.titular]=(m[e.titular]||0)+1})}
 _cont.set(key,m);return m}
function discsDe(p,ds){const key='d|'+segunda(ds)+'|'+p;if(_cont.has(key))return _cont.get(key);const st=new Set();
 for(const d of semana(ds)){const c=ctx(d);if(!c.mod)continue;cadaAula(d,(t,s)=>{const e=eff(d,t.id,s.a,null);if(e.titular===p&&e.disc)st.add(norm(e.disc))})}
 _cont.set(key,st);return st}
function periodoMes(s){return [s.slice(0,8)+'01',s.slice(0,8)+'31']}
function periodoSemana(s){const w=semana(s);return [w[0],w[w.length-1]]}
function periodoAno(s){const a=anoDe(s);return a?[a.inicio,a.fim]:[s,s]}
const CRITERIOS={subs_mes:'menos coberturas no mês',subs_semana:'menos coberturas na semana',carga:'menos aulas na semana (grade + coberturas)',prop:'menos coberturas no mês, proporcional à carga'};
function pontuador(s){const c=S.aj.criterio;
 if(c==='subs_semana'){const m=contagens(...periodoSemana(s));return p=>{const n=m[p]||0;return {v:n,txt:`${n} cobertura${n===1?'':'s'} na semana`}}}
 if(c==='carga'){const m=contagens(...periodoSemana(s)),cg=cargaSemana(s);return p=>{const n=(cg[p]||0)+(m[p]||0);return {v:n,txt:`${n} aulas na semana (grade + coberturas)`}}}
 if(c==='prop'){const m=contagens(...periodoMes(s)),cg=cargaSemana(s);return p=>{const n=m[p]||0,g=cg[p]||0;return {v:n/Math.max(1,g),txt:`${n} cobertura${n===1?'':'s'} no mês para ${g} aulas semanais`}}}

function candidatos(ds,tid,a){
 const c=ctx(ds),dr=dayRec(ds)||{cells:{},ausentes:{},fora:{}},t=turmaDe(c.ano,tid),sl=slotOf(c.ano,ds,c.mod,t.seg,a,dr),i=min(sl.i),f=min(sl.f);
 const e=eff(ds,tid,a,dr);const occ=ocupacoes(ds,dr).filter(o=>o.comp||!(o.tid===tid&&o.a===a));const ind=indisponiveis(ds,dr);

 for(const p of profsDoAno(c.ano)){const P=S.profs[p];
  if(p===e.titular||dr.ausentes[p]||licencaDe(p,ds))continue;
  if(P.dias&&P.dias[c.dia]===false)continue;
  const meu=occ.filter(o=>o.prof===p);
  if(meu.some(o=>o.i<f&&i<o.f))continue;
  if(ind.some(o=>o.prof===p&&o.i<f&&i<o.f))continue;
  const antes=maiorFolga(meu.map(o=>[o.i,o.f])),depois=maiorFolga([...meu.map(o=>[o.i,o.f]),[i,f]]);
  const quebra=antes>=S.aj.almMin&&depois<S.aj.almMin;
  const sc=pt(p);const presente=meu.some(o=>!o.comp);const mesma=!!disc&&discsDe(p,ds).has(disc);
  const why=[sc.txt];if(S.aj.desNaEscola)why.push(presente?'já está na escola neste dia':'não tem aula neste dia');if(S.aj.desMesmaDisc&&mesma)why.push('dá a mesma disciplina');
  out.push({p,v:sc.v,presente,mesma,quebra,why})}
 out.sort((x,y)=>(x.quebra-y.quebra)||(x.v-y.v)||(S.aj.desNaEscola?(y.presente-x.presente):0)||(S.aj.desMesmaDisc?(y.mesma-x.mesma):0)||nm(x.p).localeCompare(nm(y.p),'pt'));
 return out;
}

   AÇÕES DO DIA
   ===================================================================== */
function ov(ds,tid,a){const dr=garantirDia(ds);return dr.cells[tid+'|'+a]=dr.cells[tid+'|'+a]||{}}
function limparOv(ds,tid,a){const dr=dayRec(ds);if(!dr)return;const o=dr.cells[tid+'|'+a];if(o&&!Object.keys(o).length)delete dr.cells[tid+'|'+a]}
function aulasOrdenadas(ds,dr){const xs=[];cadaAula(ds,(t,s)=>xs.push({tid:t.id,a:s.a,i:min(s.i)}),dr);return xs.sort((p,q)=>p.i-q.i)}
function preencher(ds,alvo){const dr=garantirDia(ds);let n=0;for(const x of alvo){_cont.clear();const cs=candidatos(ds,x.tid,x.a).filter(c=>!c.quebra);if(!cs.length)continue;const e=eff(ds,x.tid,x.a,dr);const o=ov(ds,x.tid,x.a);if(e.vaga)o.cobre=cs[0].p;else o.sub=cs[0].p;n++}return n}
function registrarFalta(ds,pid,motivo){const dr=garantirDia(ds);dr.ausentes[pid]={motivo};const alvo=[];
 for(const x of aulasOrdenadas(ds,dr)){const e=eff(ds,x.tid,x.a,dr);if(e.fora||e.dispensa||e.eventoLivre)continue;
  if(e.titular===pid){const o=ov(ds,x.tid,x.a);o.falta=true;o.sub=null;o.motivo=motivo;alvo.push(x)}
  else if(e.vaga&&e.cobre===pid){ov(ds,x.tid,x.a).cobre=null;alvo.push(x)}
  else if(e.falta&&e.sub===pid){ov(ds,x.tid,x.a).sub=null;alvo.push(x)}}
 const n=preencher(ds,alvo);salvar();return {total:alvo.length,n}}
function desfazerFalta(ds,pid){const dr=dayRec(ds);if(!dr)return;delete dr.ausentes[pid];
 for(const x of aulasOrdenadas(ds,dr)){const o=dr.cells[x.tid+'|'+x.a];if(!o)continue;const base=eff(ds,x.tid,x.a,{cells:{},ausentes:{},fora:{},trocas:dr.trocas,blocoAula:dr.blocoAula});
  if(base.titular===pid&&o.falta){delete o.falta;delete o.sub;delete o.motivo;delete o.troca}
  if(base.vaga&&base.cobre===pid&&'cobre' in o)delete o.cobre;
  limparOv(ds,x.tid,x.a)}salvar()}

/* ---- ajustar o horário de um dia: trocar horários, bloco vira aula, evento ---- */
function rotSlot(s){if(!s)return '';if(s.extra)return 'aula extra';if(s.b)return s.b.charAt(0)+s.b.slice(1).toLowerCase();return `${s.a}ª aula`}
function nomeSeg(ano,id){return (ano.segs.find(s=>s.id===id)||{}).nome||id}
function listaAjustes(c,dr){const out=[];
 (dr.trocas||[]).forEach((t,i)=>{const b=sinal(c.ano,dataAtual,c.mod,t.seg);out.push({tipo:'troca',i,txt:`${nomeSeg(c.ano,t.seg)}: ${rotSlot(b[t.x])} (${b[t.x]?b[t.x].i:''}) ⇄ ${rotSlot(b[t.y])} (${b[t.y]?b[t.y].i:''})`,
  ban:`${rotSlot(b[t.x]).toUpperCase()} ÀS ${b[t.y]?b[t.y].i:''} · ${rotSlot(b[t.y]).toUpperCase()} ÀS ${b[t.x]?b[t.x].i:''}`})});
 for(const k in (dr.blocoAula||{})){const[sg,p]=k.split('|');const s=sinalDia(c.ano,dataAtual,c.mod,sg,dr)[+p];const bl=s&&s.extra?s.extra.bloco:'bloco';
  out.push({tipo:'bloco',k,txt:`${nomeSeg(c.ano,sg)}: ${bl.toLowerCase()} das ${s?s.i:''} vira aula`,ban:`SEM ${bl.toUpperCase()} · AULA ÀS ${s?s.i:''}`})}
 (dr.eventos||[]).forEach((ev,i)=>out.push({tipo:'evento',i,txt:`${ev.nome} · ${ev.i}–${ev.f} · ${ev.turmas==='todas'?'todas as turmas':ev.turmas.map(x=>tn(c.ano,x)).join(', ')} · ${ev.prof==='livre'?'professores ficam livres':'professor fica com a turma'}`,ban:`${ev.nome.toUpperCase()} ${ev.i}–${ev.f}`}));
 return out}
function bannerDia(c,dr){const xs=[...new Set(listaAjustes(c,dr).map(x=>x.ban))];return xs.length?'HORÁRIO ALTERADO HOJE: '+xs.join(' · '):''}

 const blocos=[];for(const sg of segs)sinalDia(c.ano,dataAtual,c.mod,sg.id,dr).forEach((s,i)=>{if(s.b&&norm(s.b)!=='almoco'&&norm(s.b)!=='cafe')blocos.push({v:sg.id+'|'+i,t:`${nomeSeg(c.ano,sg.id)} · ${rotSlot(s)} ${s.i}–${s.f}`,i:s.i})});

 <p class="nota">Mudanças só deste dia. Os alertas são recalculados, a imagem ganha uma faixa de aviso e o "Meu dia" avisa cada professor que teve o horário mudado.</p>`;
 if(ajs.length)h+='<h3>Ajustes de hoje</h3><ul class="cands">'+ajs.map(a=>`<li class="cand"><span class="nome" style="font-weight:600">${esc(a.txt)}</span><button class="btn mini" data-desf-${a.tipo}="${esc(a.tipo==='bloco'?a.k:a.i)}">Desfazer</button></li>`).join('')+'</ul>';

 p.innerHTML=h;ligarFechar();

 const D=()=>{const d=garantirDia(dataAtual);d.trocas=d.trocas||[];d.blocoAula=d.blocoAula||{};d.eventos=d.eventos||[];return d};
 $('#hd-seg').onchange=ev=>{const o=optsSlots(ev.target.value);$('#hd-x').innerHTML=o;$('#hd-y').innerHTML=o};
 const trocar=(seg,x,y)=>{const s=sinalDia(c.ano,dataAtual,c.mod,seg,dayRec(dataAtual)),X=s[x],Y=s[y];

  if(erros.length&&!n)return msg(erros.join(' '));salvar();render()};
 const hb=$('#hd-bloco');if(hb)hb.onclick=()=>{const[sg,p0]=$('#hd-bl').value.split('|');const rot=$('#hd-bl-rot').value.trim()||'Aula';const dr2=D();

/* ---------- Professores ---------- */
let PR=null;
const COMP_RX=/^(seg|ter|qua|qui|sex|sab)\s+(\d{1,2}:\d{2})\s*(?:-|–|a|às|as)\s*(\d{1,2}:\d{2})\s*(.*)$/i;
function compTxt(cs){return (cs||[]).map(c=>`${c.dia} ${c.i}-${c.f} ${c.nome||''}`.trim()).join('\n')}
function abrirProfs(){const c=ctx(dataAtual);const ano=c.ano||anosOrd().slice(-1)[0];
 PR={ano:ano.id,lista:Object.values(S.profs).sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(p=>({id:p.id,nome:p.nome,dias:Object.assign({seg:true,ter:true,qua:true,qui:true,sex:true,sab:false},p.dias),carga:p.carga===undefined?'':p.carga,comp:compTxt(p.comp),quadro:ano.profs.includes(p.id)})),erro:'',msg:''};renderProfs()}
function lerProfs(){$$('#modal .card[data-i]').forEach(cd=>{const p=PR.lista[+cd.dataset.i];p.nome=$('.pr-nome',cd).value;p.carga=$('.pr-carga',cd).value;p.comp=$('.pr-comp',cd).value;p.quadro=$('.pr-quadro',cd).checked;$$('.pr-dia',cd).forEach(x=>p.dias[x.dataset.d]=x.checked)})}

 const ano=S.anos[PR.ano];
 let h=`${X}<h2>Professores</h2><p class="nota">Cadastro único: cada pessoa aparece uma vez, mesmo que o nome tenha sido escrito de jeitos diferentes nos prints. Desmarque "No quadro" para quem não trabalha mais neste ano (o histórico continua guardado).</p>
 <p class="nota">Compromissos fixos (ATPC, horário de estudo, reunião): um por linha, no formato <b>qua 13:20-14:10 ATPC</b>. Nesses horários o professor não é sugerido para cobrir, e o sistema avisa se ele for escalado em aula.</p>
 <div class="cards">${PR.lista.map((p,i)=>`<div class="card${p.quadro?'':' fora-quadro'}" data-i="${i}">
  <div class="campo" style="margin:0"><label>Nome</label><input type="text" class="inp pr-nome" value="${esc(p.nome)}" aria-label="Nome"></div>
  <label class="check" style="margin:0"><input type="checkbox" class="pr-quadro"${p.quadro?' checked':''}> <span>No quadro de ${esc(ano.id)}</span></label>
  <div><span class="rot">Dias em que vem à escola</span><div class="dias-chk">${SEMANA.map(d=>`<label><input type="checkbox" class="pr-dia" data-d="${d}"${p.dias[d]?' checked':''}>${d}</label>`).join('')}</div></div>
  <div class="campo" style="margin:0"><label>Carga máxima (aulas/semana)</label><input type="number" min="0" class="inp pr-carga" value="${esc(p.carga)}" placeholder="sem limite"></div>
  <div class="campo" style="margin:0"><label>Compromissos fixos</label><textarea class="inp pr-comp" rows="2" placeholder="qua 13:20-14:10 ATPC">${esc(p.comp)}</textarea></div></div>`).join('')}</div>
 <div class="linha-btn"><button class="btn" id="pr-add">Novo professor</button></div>
 ${PR.erro?`<div class="erro-msg">${PR.erro}</div>`:''}${PR.msg?`<div class="ok-msg">${PR.msg}</div>`:''}
 <div class="linha-btn"><button class="btn pri" id="pr-ok">Salvar professores</button><button class="btn m-x">Fechar</button></div>`;

 $('#pr-ok').onclick=()=>{lerProfs();const erros=[];const nomes=new Set();
  PR.lista=PR.lista.filter(p=>p.id||p.nome.trim());
  for(const p of PR.lista){const n=p.nome.trim();if(!n){erros.push('Há um professor sem nome.');continue}if(nomes.has(norm(n)))erros.push(`O nome ${esc(n)} aparece duas vezes.`);nomes.add(norm(n));
   p._comp=[];for(const l of p.comp.split('\n').map(s=>s.trim()).filter(Boolean)){const m=l.match(COMP_RX);if(!m||min(m[2])>=min(m[3])){erros.push(`${esc(n)}: não entendi o compromisso "${esc(l)}". Use o formato qua 13:20-14:10 ATPC.`);continue}p._comp.push({dia:m[1].toLowerCase(),i:pad5(m[2]),f:pad5(m[3]),nome:m[4].trim()||'Compromisso'})}}

/* ---------- Meu dia (texto para cada professor) ---------- */
function textoProf(ds,pid,dr){const c=ctx(ds);const linhas=[];let muda=false;
 cadaAula(ds,(t,s)=>{const e=eff(ds,t.id,s.a,dr);if(e.ocupante!==pid)return;let x=`${s.i}–${s.f} · ${t.nome}${e.disc?' · '+e.disc:''}`;
  if(e.falta&&e.sub===pid){x+=` (cobrindo ${nm(e.titular)}${e.troca?', troca combinada':''})`;muda=true}
  else if(e.extra){x+=` (no lugar do ${s.extra.bloco.toLowerCase()})`;muda=true}
  else if(e.vaga){x+=' (aula sem professor atribuído)';muda=true}
  if(s.de){x+=` ⚠ horário mudou, era ${s.de.i}–${s.de.f}`;muda=true}
  if(e.evento){x+=` · ${e.evento}`;muda=true}
  linhas.push({i:min(s.i),x})},dr);
 const P=S.profs[pid];for(const cp of (P.comp||[]))if(cp.dia===c.dia)linhas.push({i:min(cp.i),x:`${cp.i}–${cp.f} · ${cp.nome}`});
 const ban=dr?bannerDia(c,dr):'';
 linhas.sort((a,b)=>a.i-b.i);return {muda,txt:`*${NOME_DIA[c.dia]}, ${br(ds)}* · ${nm(pid)}\n`+(ban?ban.charAt(0)+ban.slice(1).toLowerCase()+'\n':'')+linhas.map(l=>'• '+l.x).join('\n'),n:linhas.length}}
function abrirMeuDia(so){const c=ctx(dataAtual);if(!c.mod){alertaModal('Escolha um dia com aula.');return}const dr=dayRec(dataAtual);if(dr&&dr.semAula){alertaModal('Este dia está marcado como sem aula.');return}
 so=so!==false;const aus=(dr&&dr.ausentes)||{};
 const lista=profsDoAno(c.ano).filter(p=>!aus[p]&&!licencaDe(p,dataAtual)).map(p=>Object.assign({p},textoProf(dataAtual,p,dr))).filter(x=>x.n&&(!so||x.muda));
 modal(`${X}<h2>Meu dia</h2><p class="nota">Texto pronto para mandar no privado de cada professor. ${so?'Mostrando só quem tem cobertura hoje.':'Mostrando todos.'} <button class="btn link" id="md-tog">${so?'Mostrar todos':'Só quem tem cobertura'}</button></p>
 ${lista.length?lista.map((x,i)=>`<div class="card" style="margin-bottom:8px"><div class="texto-dia">${esc(x.txt)}</div><div class="linha-btn" style="margin:0"><button class="btn mini" data-cp="${i}">Copiar</button><span class="nota" id="md-m${i}"></span></div></div>`).join(''):'<p>Ninguém tem cobertura neste dia.</p>'}
 <div class="linha-btn"><button class="btn m-x">Fechar</button></div>`,false,true);
 $('#md-tog').onclick=()=>abrirMeuDia(!so);
 $$('#modal button[data-cp]').forEach(b=>b.onclick=()=>{const i=+b.dataset.cp;copiar(lista[i].txt,$('#md-m'+i))});
}

/* ---------- Ajustes ---------- */
function abrirAjustes(){
 const a=S.aj;const r=(v,t)=>`<label class="check"><input type="radio" name="crit" value="${v}"${a.criterio===v?' checked':''}> <span>${t}</span></label>`;
 modal(`${X}<h2>Ajustes</h2>
 <fieldset><legend>Quem é sugerido primeiro para substituir</legend>
  ${r('subs_mes','Quem fez menos coberturas no mês')}${r('subs_semana','Quem fez menos coberturas na semana')}${r('carga','Quem tem menos aulas na semana (grade + coberturas)')}${r('prop','Quem fez menos coberturas no mês, proporcional às aulas que tem (justo para quem tem carga pequena)')}
  <label class="check"><input type="checkbox" id="aj-vaga"${a.contaVaga?' checked':''}> <span>Cobrir aula sem professor atribuído (amarelo) conta como cobertura</span></label>
  <p class="nota">Desempate:</p>
  <label class="check"><input type="checkbox" id="aj-esc"${a.desNaEscola?' checked':''}> <span>Preferir quem já está na escola nesse dia</span></label>
  <label class="check"><input type="checkbox" id="aj-disc"${a.desMesmaDisc?' checked':''}> <span>Preferir quem dá a mesma disciplina</span></label>
 </fieldset>
 <fieldset><legend>Almoço</legend><div class="grade-aj">
  <div class="campo"><label for="aj-ai">Janela de almoço começa</label><input type="text" id="aj-ai" class="inp" value="${esc(a.almIni)}"></div>
  <div class="campo"><label for="aj-af">Janela de almoço termina</label><input type="text" id="aj-af" class="inp" value="${esc(a.almFim)}"></div>
  <div class="campo"><label for="aj-am">Minutos livres mínimos</label><input type="text" id="aj-am" class="inp" value="${esc(a.almMin)}"></div></div>
  <label class="check"><input type="checkbox" id="aj-lista"${a.conferirLista?' checked':''}> <span>Avisar quando alguém da lista do almoço estiver dando aula nesse horário</span></label>
 </fieldset>
 <fieldset><legend>Reunião de professores</legend><div class="campo"><label for="aj-reun">Blocos em que os professores estão em reunião (um por linha, como aparece na grade). Nesses horários ninguém é sugerido para cobrir. Se o bloco mudar de horário ou for cancelado no dia, a reunião acompanha.</label><textarea id="aj-reun" class="inp" rows="2">${esc((a.blocosReuniao||[]).join('\n'))}</textarea></div></fieldset>
 <fieldset><legend>Motivos de falta</legend><div class="campo"><label for="aj-mot">Um por linha. Ficam só no sistema e nunca aparecem na imagem.</label><textarea id="aj-mot" class="inp" rows="5">${esc(a.motivos.join('\n'))}</textarea></div></fieldset>
 <fieldset><legend>Etiquetas</legend><div id="aj-etqs">${a.etiquetas.map(e=>`<div class="etq-linha"><input type="color" value="${esc(e.cor)}" aria-label="Cor"><input type="text" class="inp" value="${esc(e.nome)}" aria-label="Nome" data-id="${esc(e.id)}"></div>`).join('')}</div>
  <button class="btn mini" id="aj-etq-add">Nova etiqueta</button></fieldset>
 <div class="linha-btn"><button class="btn pri" id="aj-ok">Salvar ajustes</button><button class="btn m-x">Cancelar</button></div><div id="aj-m"></div>`);
 $('#aj-etq-add').onclick=()=>{const d=document.createElement('div');d.className='etq-linha';d.innerHTML=`<input type="color" value="#1d5aa6" aria-label="Cor"><input type="text" class="inp" value="" placeholder="Nome da etiqueta" aria-label="Nome" data-id="${uid('e')}">`;$('#aj-etqs').appendChild(d)};
 $('#aj-ok').onclick=()=>{const m=t=>$('#aj-m').innerHTML=`<div class="erro-msg">${esc(t)}</div>`;
  const ai=$('#aj-ai').value.trim(),af=$('#aj-af').value.trim(),am=parseInt($('#aj-am').value,10);
  if(!HORA_OK.test(ai)||!HORA_OK.test(af)||min(ai)>=min(af))return m('Escreva a janela de almoço no formato 11:40 e 14:10, com o início antes do fim.');
  if(!(am>0))return m('Os minutos de almoço precisam ser um número maior que zero.');
  const mot=$('#aj-mot').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!mot.length)return m('Deixe pelo menos um motivo de falta.');
  a.criterio=document.querySelector('input[name=crit]:checked').value;a.contaVaga=$('#aj-vaga').checked;a.desNaEscola=$('#aj-esc').checked;a.desMesmaDisc=$('#aj-disc').checked;
  a.almIni=pad5(ai);a.almFim=pad5(af);a.almMin=am;a.conferirLista=$('#aj-lista').checked;a.motivos=mot;a.blocosReuniao=$('#aj-reun').value.split('\n').map(s=>s.trim()).filter(Boolean);
  a.etiquetas=$$('#aj-etqs .etq-linha').map(l=>{const[c,n]=l.querySelectorAll('input');return {id:n.dataset.id,nome:n.value.trim(),cor:c.value}}).filter(e=>e.nome);
  salvar();fechaModal()};
}

/* ---------- Imagem, backup, aviso ---------- */
function alertaModal(t){modal(`${X}<p>${esc(t)}</p><div class="linha-btn"><button class="btn m-x">Fechar</button></div>`)}
function gerarImagem(){
 const c=ctx(dataAtual);if(!c.mod)return alertaModal('Escolha um dia com aula.');
 if(!window.html2canvas)return alertaModal('Não consegui carregar o gerador de imagem. Verifique a internet e tente de novo.');
 if(modo==='dia'){garantirDia(dataAtual);salvar()}
 const f=$('#folha');f.classList.add('exportando');
 html2canvas(f,{scale:2,backgroundColor:'#ffffff'}).then(cv=>{f.classList.remove('exportando');const url=cv.toDataURL('image/png');
  modal(`${X}<h2>Imagem pronta para o WhatsApp</h2><p class="nota">${dentroDeMoldura?'Clique com o botão direito na imagem e escolha "Copiar imagem" (no celular, toque e segure). Depois é só colar no grupo.':'Baixe a imagem ou copie e cole direto no grupo.'}</p><img alt="Programação do dia" src="${url}"><div class="linha-btn">${dentroDeMoldura?'':'<button class="btn pri" id="im-b">Baixar PNG</button>'}<button class="btn" id="im-c">Copiar imagem</button><button class="btn m-x">Fechar</button></div><p class="nota" id="im-m"></p>`,true);
  const bb=$('#im-b');if(bb)bb.onclick=()=>baixar(`programacao-${dataAtual}.png`,url);
  $('#im-c').onclick=()=>{cv.toBlob(bl=>{try{navigator.clipboard.write([new ClipboardItem({'image/png':bl})]).then(()=>$('#im-m').textContent='Imagem copiada. Cole no WhatsApp.',()=>$('#im-m').textContent='O navegador não deixou copiar. Use o botão direito na imagem.')}catch(e){$('#im-m').textContent='O navegador não deixou copiar. Use o botão direito na imagem.'}})};
 }).catch(()=>{f.classList.remove('exportando');alertaModal('Não foi possível gerar a imagem.')});
}
function abrirBackup(){
 modal(`${X}<h2>Backup dos dados</h2>
 <p class="nota">Os dados ficam salvos online e o sistema guarda sozinho uma cópia por dia. Se quiser uma cópia no seu computador, copie ou baixe o texto abaixo. Para restaurar, cole um backup e clique em Restaurar.</p>
 <div class="campo"><label for="bk-t">Dados</label><textarea id="bk-t" class="inp json">${esc(JSON.stringify(S))}</textarea></div>
 <div class="linha-btn"><button class="btn" id="bk-c">Copiar</button>${dentroDeMoldura?'':'<button class="btn" id="bk-d">Baixar arquivo</button>'}<button class="btn pri" id="bk-r">Restaurar o que está na caixa</button><button class="btn perigo" id="bk-z">Apagar tudo</button></div><p class="nota" id="bk-m"></p>`);
 $('#bk-c').onclick=()=>{const t=$('#bk-t');navigator.clipboard.writeText(t.value).then(()=>$('#bk-m').textContent='Copiado.',()=>{t.select();$('#bk-m').textContent='Texto selecionado. Use Ctrl+C.'})};
 const d=$('#bk-d');if(d)d.onclick=()=>baixar(`backup-programacao-${iso(new Date())}.json`,'data:application/json;charset=utf-8,'+encodeURIComponent($('#bk-t').value));
 $('#bk-r').onclick=()=>{try{const x=JSON.parse($('#bk-t').value);if(x.v!==3||!x.anos||!x.profs)throw 0;S=x;S.aj=Object.assign(clone(AJ0),S.aj||{});S.licencas=S.licencas||[];S.ajCont=S.ajCont||[];salvar();fechaModal()}catch(e){$('#bk-m').textContent='Esse texto não é um backup válido deste sistema.'}};
 let conf=false;$('#bk-z').onclick=ev=>{if(!conf){conf=true;ev.target.textContent='Clique de novo para confirmar';return}S=construirInicial();dataAtual=iso(new Date());sel=null;salvar();fechaModal()};
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
function mudaData(delta){const d=dt(dataAtual);for(let i=0;i<14;i++){d.setDate(d.getDate()+delta);const c=ctx(iso(d));if(!c.ano||c.mod)break}dataAtual=iso(d);sel=null;render()}
$('#b-ant').onclick=()=>mudaData(-1);$('#b-prox').onclick=()=>mudaData(1);
$('#i-data').onchange=ev=>{if(ev.target.value){dataAtual=ev.target.value;sel=null;render()}};
$('#m-dia').onclick=()=>{modo='dia';sel=null;render()};$('#m-base').onclick=()=>{modo='base';sel=null;render()};
$('#b-falta').onclick=()=>{const c=ctx(dataAtual);if(!c.mod)return;sel={tipo:'falta'};render()};
$('#b-img').onclick=gerarImagem;$('#b-meu').onclick=()=>abrirMeuDia(true);
$('#b-hor').onclick=()=>{const c=ctx(dataAtual);if(!c.mod)return;sel={tipo:'hdia'};render()};
const ABRE={senha:()=>telaSenha(false),sair:()=>sair(),atrib:abrirAtrib,profs:abrirProfs,turmas:abrirTurmas,contador:()=>abrirContador(),ajustes:abrirAjustes,backup:abrirBackup};
$$('#menu button[data-abre]').forEach(b=>b.onclick=()=>{$('#menu').open=false;ABRE[b.dataset.abre]()});
document.addEventListener('click',ev=>{const m=$('#menu');if(m.open&&!m.contains(ev.target))m.open=false});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if($('#modal').innerHTML)fechaModal();else if($('#menu').open)$('#menu').open=false;else if(sel){fecharPainel();render()}}});

/* =====================================================================
   NUVEM: login e salvamento no banco online (Supabase)
   O banco só entrega e aceita dados para os e-mails cadastrados como membros.
   ===================================================================== */
const SUPA_URL='https://nvtzkgselewgisuakdfp.supabase.co';
const SUPA_KEY='sb_publishable_3XxQYY-nRfx-Vq5R2paQyA_Iwbvf_Hc';
const CHAVE_SESSAO='programacao-aulas-sessao';
let sessao=null,versaoNuvem=0,ultimoEnviado='',timerNuvem=null,enviando=false,pendente=false,nuvemPronta=false;
function lerSessao(){try{return JSON.parse(localStorage.getItem(CHAVE_SESSAO)||'null')}catch(e){return null}}
function gravarSessao(s){sessao=s;try{if(s)localStorage.setItem(CHAVE_SESSAO,JSON.stringify(s));else localStorage.removeItem(CHAVE_SESSAO)}catch(e){}}
function guardaSessao(j){gravarSessao({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:j.user})}
async function api(caminho,op={}){
 const h={apikey:SUPA_KEY,'Content-Type':'application/json'};
 if(op.auth!==false&&sessao)h.Authorization='Bearer '+sessao.access_token;
 const r=await fetch(SUPA_URL+caminho,{method:op.method||'GET',headers:h,body:op.body?JSON.stringify(op.body):undefined});
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){j=t}
 if(!r.ok){const e=new Error(String((j&&(j.message||j.msg||j.error_description||j.error))||('HTTP '+r.status)));e.status=r.status;throw e}
 return j}
async function tokenValido(){
 if(!sessao)throw Object.assign(new Error('sem_sessao'),{status:401});
 if(sessao.expires_at-60>Date.now()/1000)return;
 try{guardaSessao(await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:sessao.refresh_token}}))}
 catch(e){if(e.status>=400&&e.status<500){gravarSessao(null);e.status=401}throw e}}
async function entrar(email,senha){guardaSessao(await api('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email,password:senha}}))}
async function sair(){if(nuvemPronta&&JSON.stringify(S)!==ultimoEnviado){await enviarNuvem()}try{await tokenValido();await api('/auth/v1/logout',{method:'POST'})}catch(e){}gravarSessao(null);nuvemPronta=false;location.reload()}
async function baixarEstado(){await tokenValido();const r=await api('/rest/v1/escola_estado?id=eq.escola&select=dados,versao');if(!r||!r.length)throw Object.assign(new Error('sem_acesso'),{semAcesso:true});return r[0]}
function normalizar(x){x.aj=Object.assign(clone(AJ0),x.aj||{});x.licencas=x.licencas||[];x.ajCont=x.ajCont||[];delete x.ultima;return x}
function aplicarEstado(r){S=normalizar(r.dados);versaoNuvem=r.versao;ultimoEnviado=JSON.stringify(S);limparCache()}
function statusNuvem(t,erro){const e=$('#nuvem');if(e){e.textContent=t;e.classList.toggle('erro',!!erro)}}
function agendarNuvem(ms){if(!nuvemPronta)return;clearTimeout(timerNuvem);timerNuvem=setTimeout(enviarNuvem,ms||1200)}
async function enviarNuvem(){
 if(!nuvemPronta)return;
 if(enviando){pendente=true;return}
 const t=JSON.stringify(S);if(t===ultimoEnviado){statusNuvem('Salvo ✓');return}
 enviando=true;statusNuvem('Salvando…');
 try{await tokenValido();versaoNuvem=await api('/rest/v1/rpc/salvar_estado',{method:'POST',body:{p_dados:JSON.parse(t),p_versao:versaoNuvem}});ultimoEnviado=t;statusNuvem(JSON.stringify(S)===t?'Salvo ✓':'Salvando…')}
 catch(e){
  if(e.message.includes('conflito')){
   try{aplicarEstado(await baixarEstado());sel=null;statusNuvem('Salvo ✓');render();alertaModal('Outra pessoa salvou mudanças ao mesmo tempo. Abri a versão mais nova; se a sua última alteração sumiu, é só refazer.')}
   catch(e2){statusNuvem('Não salvou — tentando de novo…',true);agendarNuvem(10000)}}
  else if(e.status===401){statusNuvem('Entre de novo para salvar',true);mostrarLogin('Sua sessão expirou. Entre de novo; o que você fez não se perdeu.',()=>{$('#login').hidden=true;agendarNuvem(10)})}
  else if(e.message.includes('sem_acesso')){statusNuvem('Sem permissão para salvar',true)}
  else{statusNuvem('Sem internet — tentando de novo…',true);agendarNuvem(10000)}}
 finally{enviando=false;if(pendente){pendente=false;agendarNuvem(10)}}}
/* quando outra pessoa salva, traz a versão nova (se aqui não há nada pendente e nada aberto) */
async function conferirNovidade(){
 if(!nuvemPronta||enviando||document.hidden)return;
 if(JSON.stringify(S)!==ultimoEnviado||$('#modal').innerHTML||sel)return;
 try{await tokenValido();const r=await api('/rest/v1/escola_estado?id=eq.escola&select=versao');
  if(r&&r.length&&r[0].versao!==versaoNuvem){aplicarEstado(await baixarEstado());render()}}catch(e){}}
setInterval(conferirNovidade,60000);
document.addEventListener('visibilitychange',conferirNovidade);
window.addEventListener('beforeunload',ev=>{if(nuvemPronta&&JSON.stringify(S)!==ultimoEnviado){ev.preventDefault();ev.returnValue=''}});

function telaLogin(html){const L=$('#login');L.hidden=false;L.innerHTML=html;return L}
function mostrarLogin(msg,depois){
 const L=telaLogin(`<form id="lg-f" novalidate><h1>Programação de Aulas</h1><p class="nota">Acesso só para a coordenação.</p>
  <label>E-mail<input id="lg-e" type="email" autocomplete="username" required></label>
  <label>Senha<input id="lg-s" type="password" autocomplete="current-password" required></label>
  <p class="msg" id="lg-m" role="alert">${esc(msg||'')}</p><button class="btn pri" id="lg-b">Entrar</button></form>`);
 $('#lg-e').focus();
 $('#lg-f').onsubmit=async ev=>{ev.preventDefault();const b=$('#lg-b'),m=$('#lg-m');
  if(!$('#lg-e').value.trim()||!$('#lg-s').value){m.textContent='Preencha e-mail e senha.';return}
  b.disabled=true;m.textContent='';b.textContent='Entrando…';
  try{await entrar($('#lg-e').value.trim(),$('#lg-s').value);await (depois||abrirSistema)()}
  catch(e){m.textContent=e.status===400?'E-mail ou senha incorretos.':'Não consegui conectar. Verifique a internet e tente de novo.';b.disabled=false;b.textContent='Entrar'}}}
function telaSenha(obrig){
 telaLogin(`<form id="sn-f" novalidate><h1>${obrig?'Crie sua senha':'Trocar minha senha'}</h1>
  <p class="nota">${obrig?'Primeiro acesso: troque a senha provisória por uma só sua. ':''}Use pelo menos 8 caracteres.</p>
  <label>Nova senha<input id="sn-1" type="password" autocomplete="new-password"></label>
  <label>Repita a nova senha<input id="sn-2" type="password" autocomplete="new-password"></label>
  <p class="msg" id="sn-m" role="alert"></p><button class="btn pri" id="sn-b">Salvar senha</button>${obrig?'':'<button type="button" class="btn" id="sn-x">Cancelar</button>'}</form>`);
 $('#sn-1').focus();
 const x=$('#sn-x');if(x)x.onclick=()=>{$('#login').hidden=true};
 $('#sn-f').onsubmit=async ev=>{ev.preventDefault();const a=$('#sn-1').value,b=$('#sn-2').value,m=$('#sn-m');
  if(a.length<8){m.textContent='A senha precisa ter pelo menos 8 caracteres.';return}
  if(a!==b){m.textContent='As duas senhas não são iguais.';return}
  $('#sn-b').disabled=true;m.textContent='';
  try{await tokenValido();const u=await api('/auth/v1/user',{method:'PUT',body:{password:a,data:{trocar_senha:false}}});sessao.user=u;gravarSessao(sessao);
   $('#login').hidden=true;if(obrig)iniciarTela();else alertaModal('Senha trocada.')}
  catch(e){$('#sn-b').disabled=false;m.textContent=/different|igual|same/i.test(e.message)?'A nova senha precisa ser diferente da atual.':/weak|short|fraca/i.test(e.message)?'Senha muito fraca. Tente outra mais longa.':'Não consegui trocar a senha. Tente de novo.'}}}
function semAcesso(){
 telaLogin(`<form><h1>Sem acesso</h1><p>A conta <b>${esc(sessao&&sessao.user&&sessao.user.email||'')}</b> entrou, mas não está na lista de quem pode ver a programação da escola.</p><button type="button" class="btn" id="sa-x">Sair</button></form>`);
 $('#sa-x').onclick=()=>{gravarSessao(null);location.reload()}}
function iniciarTela(){$('#login').hidden=true;$('#login').innerHTML='';statusNuvem('Salvo ✓');fecharPainel();render()}
async function abrirSistema(){
 try{aplicarEstado(await baixarEstado());nuvemPronta=true;
  const md=sessao.user&&sessao.user.user_metadata;
  if(md&&md.trocar_senha){telaSenha(true);return}
  iniciarTela()}
 catch(e){
  if(e.semAcesso)semAcesso();
  else if(e.status===401){gravarSessao(null);mostrarLogin('Entre de novo.')}
  else mostrarLogin('Não consegui carregar os dados. Verifique a internet e tente de novo.')}}
sessao=lerSessao();
if(sessao)abrirSistema();else mostrarLogin();
</script>
